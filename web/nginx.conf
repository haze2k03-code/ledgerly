server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API requests go to the Express server; everything else is the React app.
  location /graphql {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed asset files never change, so browsers can cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths like /transactions serve index.html and React Router takes over.
  location / {
    try_files $uri /index.html;
  }
}
